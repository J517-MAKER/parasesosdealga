<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0E7C7B">
    <meta name="robots" content="noindex">
    <title>Bloc de notas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/notas.css">
</head>

<body>
    <canvas id="sky-canvas" aria-hidden="true"></canvas>

    <header class="nav">
        <a class="icon-btn" href="index.html" data-go aria-label="Volver al menú" title="Volver al menú">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </a>
        <span class="brand">Bloc de notas</span>
        <div class="nav-actions">
            <button type="button" class="icon-btn" id="lock-btn" aria-label="Cerrar con llave" title="Cerrar con llave" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
            </button>
            <button type="button" id="sky-btn" class="icon-btn" aria-label="Cambiar modo de cielo">
                <span id="sky-icon" aria-hidden="true">⛅</span>
            </button>
        </div>
    </header>

    <main class="notes-page">
        <!-- ===== Candado ===== -->
        <section class="lock-wrap" id="lock-wrap">
            <form class="lock-card paper" id="lock-form" autocomplete="off">
                <span class="tape tape-l" aria-hidden="true"></span>
                <div class="padlock" id="padlock" aria-hidden="true">
                    <svg viewBox="0 0 64 64">
                        <path class="shackle" d="M20 30V21a12 12 0 0 1 24 0v9" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                        <rect x="12" y="28" width="40" height="30" rx="8" fill="#F28C28" stroke="currentColor" stroke-width="4"/>
                        <circle cx="32" cy="41" r="4.5" fill="currentColor"/>
                        <path d="M32 44v6" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1 class="lock-title">Solo para ti</h1>
                <p class="lock-sub">Escribe la contraseña para abrir tu bloc de notas.</p>
                <label class="visually-hidden" for="pass">Contraseña</label>
                <div class="pass-row">
                    <input id="pass" name="pass" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Contraseña" required>
                    <button type="button" class="eye" id="eye" aria-label="Mostrar contraseña">👁</button>
                </div>
                <button class="btn btn-teal lock-submit" type="submit">Abrir</button>
                <p class="lock-msg" id="lock-msg" role="status" aria-live="polite"></p>
            </form>
        </section>

        <!-- ===== Notas ===== -->
        <section class="notes" id="notes" hidden aria-label="Notas">
            <header class="notes-head">
                <p class="notes-kicker">Para Lucy</p>
                <h1 class="notes-title">Tu bloc de notas</h1>
                <p class="notes-count" id="notes-count"></p>
            </header>
            <div class="notes-list" id="notes-list"></div>
        </section>
    </main>

    <!-- Las notas se cargan siempre frescas (evita que el navegador muestre una versión vieja) -->
    <script>document.write('<script src="data/notas.js?v=' + Date.now() + '"><\/script>');</script>
    <script src="assets/js/sky.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/notas.js"></script>
</body>

</html>
